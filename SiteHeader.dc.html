<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=Bree+Serif&display=swap" rel="stylesheet">
<style>
body{margin:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
input::placeholder{color:inherit;opacity:0.9}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #93C5FD;outline-offset:2px}
</style>
</helmet>
<a href="#main" style="position:absolute; left:16px; top:-100px; z-index:100; padding:10px 16px; border-radius:6px; background:#fff; color:#1E3A5F; font-weight:700; font-size:14px;" style-focus="top:12px">Skip to main content</a>
<header style="position: {{ position }}; top:0; left:0; right:0; z-index:50; background: {{ bg }}; border-bottom: {{ border }}; font-family:'Hanken Grotesk', sans-serif;">
  <div style="max-width:1440px; margin:0 auto; padding:20px clamp(20px,4.4vw,64px); display:flex; align-items:center; justify-content:space-between; gap:24px; min-height:63px; box-sizing:border-box;">
    <a href="home.dc.html" style="font-weight:800; font-size:18px; letter-spacing:-0.3px; color: {{ fg }}; white-space:nowrap;">The Education Futures Council</a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Primary" style="display:flex; align-items:center; gap:36px;">
        <div style="position:relative;" onMouseEnter="{{ openVision }}" onMouseLeave="{{ closeMenu }}">
          <a href="vision.dc.html" style="display:block; font-weight:600; font-size:13px; color: {{ fg }}; padding:8px 0; white-space:nowrap;" style-hover="color:#93C5FD">The National Vision</a>
          <sc-if value="{{ visionOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute; left:0; top:100%; min-width:100%; width:max-content; border-top:1px solid {{ fg }}; border-radius:0 0 6px 6px; background: {{ menuBg }}; box-shadow:4px 4px 6px rgba(0,0,0,0.3); padding:6px 20px 10px; display:flex; flex-direction:column;">
              <a href="vision.dc.html" style="font-weight:600; font-size:13px; color: {{ fg }}; padding:10px 0; border-bottom:1px solid {{ menuRule }}; white-space:nowrap;" style-hover="color:#93C5FD">overview</a>
              <a href="council.dc.html" style="font-weight:600; font-size:13px; color: {{ fg }}; padding:10px 0; white-space:nowrap;" style-hover="color:#93C5FD">the council</a>
            </div>
          </sc-if>
        </div>
        <div style="position:relative;" onMouseEnter="{{ openTools }}" onMouseLeave="{{ closeMenu }}">
          <a href="state-tools.dc.html" style="display:block; font-weight:600; font-size:13px; color: {{ fg }}; padding:8px 0; white-space:nowrap;" style-hover="color:#93C5FD">State Tools</a>
          <sc-if value="{{ toolsOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute; left:0; top:100%; min-width:100%; width:max-content; border-top:1px solid {{ fg }}; border-radius:0 0 6px 6px; background: {{ menuBg }}; box-shadow:4px 4px 6px rgba(0,0,0,0.3); padding:6px 20px 10px; display:flex; flex-direction:column;">
              <a href="state-tools.dc.html" style="font-weight:600; font-size:13px; color: {{ fg }}; padding:10px 0; border-bottom:1px solid {{ menuRule }}; white-space:nowrap;" style-hover="color:#93C5FD">overview</a>
              <a href="sea-change-tool.dc.html" style="font-weight:600; font-size:13px; color: {{ fg }}; padding:10px 0; white-space:nowrap;" style-hover="color:#93C5FD">SEA Change Tool</a>
            </div>
          </sc-if>
        </div>
      </nav>
      <div style="display:flex; align-items:center; gap:20px;">
        <form action="search.dc.html" method="get" role="search" style="display:flex; align-items:center; gap:8px; width:180px; height:31px; border-radius:43px; box-shadow:inset 0 0 0 1px {{ fg }}; padding:7px 12px; box-sizing:border-box; margin:0;">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="{{ fg }}" stroke-width="1.5" stroke-linecap="round"><circle cx="6.2" cy="6.2" r="4.4"></circle><path d="M9.5 9.5L12.5 12.5"></path></svg>
          <input type="search" name="q" placeholder="Search..." aria-label="Search the site" style="flex:1; min-width:0; background:transparent; border:0; outline:0; font-family:inherit; font-size:13px; color: {{ fg }};">
        </form>
        <a href="bibliography.dc.html" style="font-size:13px; color: {{ fgMuted }};" style-hover="color:#93C5FD">Bibliography</a>
        <a href="mailto:mcotter@stanford.edu" style="font-size:13px; color: {{ fgMuted }};" style-hover="color:#93C5FD">Contact us</a>
      </div>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="Menu" style="width:44px; height:44px; border:0; background:transparent; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:5px; cursor:pointer; padding:0;">
        <span style="display:block; width:22px; height:2px; background: {{ fg }};"></span>
        <span style="display:block; width:22px; height:2px; background: {{ fg }};"></span>
        <span style="display:block; width:22px; height:2px; background: {{ fg }};"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ mobileOpen }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="Primary" style="background:#1E3A5F; border-top:1px solid rgba(255,255,255,0.2); padding:12px clamp(20px,4.4vw,64px) 28px; display:flex; flex-direction:column;">
      <form action="search.dc.html" method="get" role="search" style="display:flex; align-items:center; gap:10px; height:44px; margin:8px 0 12px; border-radius:44px; box-shadow:inset 0 0 0 1px #fff; padding:0 16px; box-sizing:border-box;">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><circle cx="6.2" cy="6.2" r="4.4"></circle><path d="M9.5 9.5L12.5 12.5"></path></svg>
        <input type="search" name="q" placeholder="Search..." aria-label="Search the site" style="flex:1; min-width:0; background:transparent; border:0; outline:0; font-family:inherit; font-size:16px; color:#fff;">
      </form>
      <a href="vision.dc.html" style="color:#fff; font-weight:700; font-size:16px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.15);" style-hover="color:#93C5FD">The National Vision</a>
      <a href="council.dc.html" style="color:#CBD5E1; font-size:14px; padding:12px 0 12px 16px; border-bottom:1px solid rgba(255,255,255,0.15);" style-hover="color:#93C5FD">The Council</a>
      <a href="state-tools.dc.html" style="color:#fff; font-weight:700; font-size:16px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.15);" style-hover="color:#93C5FD">State Tools</a>
      <a href="sea-change-tool.dc.html" style="color:#CBD5E1; font-size:14px; padding:12px 0 12px 16px; border-bottom:1px solid rgba(255,255,255,0.15);" style-hover="color:#93C5FD">SEA Change Tool</a>
      <a href="bibliography.dc.html" style="color:#fff; font-weight:700; font-size:16px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.15);" style-hover="color:#93C5FD">Bibliography</a>
      <a href="mailto:mcotter@stanford.edu" style="color:#fff; font-weight:700; font-size:16px; padding:14px 0;" style-hover="color:#93C5FD">Contact us</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:80},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;}}">
class Component extends DCLogic {
  state = { open: null, mobileOpen: false, mobile: false };
  componentDidMount() {
    this.mq = window.matchMedia('(max-width: 960px)');
    this.onMq = () => this.setState({ mobile: this.mq.matches, mobileOpen: false });
    this.onMq();
    this.mq.addEventListener('change', this.onMq);
  }
  componentWillUnmount() { this.mq && this.mq.removeEventListener('change', this.onMq); }
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const fg = dark ? '#FFFFFF' : '#1E3A5F';
    return {
      fg,
      fgMuted: dark ? '#CBD5E1' : '#475569',
      bg: dark ? 'linear-gradient(180deg, rgba(7,23,48,0.82) 0%, rgba(7,23,48,0.35) 60%, rgba(7,23,48,0) 100%)' : '#FFFFFF',
      border: dark ? 'none' : '1px solid #E2E8F0',
      position: dark ? 'absolute' : 'sticky',
      menuBg: dark ? 'rgba(60,98,160,0.75)' : '#F1F5F9',
      menuBorder: dark ? '#FFFFFF' : '#CBD5E1',
      menuRule: dark ? 'rgba(255,255,255,0.85)' : '#CBD5E1',
      desktop: !this.state.mobile,
      mobile: this.state.mobile,
      mobileOpen: this.state.mobile && this.state.mobileOpen,
      visionOpen: this.state.open === 'vision',
      toolsOpen: this.state.open === 'tools',
      openVision: () => this.setState({ open: 'vision' }),
      openTools: () => this.setState({ open: 'tools' }),
      closeMenu: () => this.setState({ open: null }),
      toggleMenu: () => this.setState(s => ({ mobileOpen: !s.mobileOpen })),
    };
  }
}
</script>
</body>
</html>
